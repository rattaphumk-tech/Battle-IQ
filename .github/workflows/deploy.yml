name: Build, Test and Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/battle-iq
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -q -B -DskipTests package

      # รันเทสเฉพาะเมื่อตั้ง secret ฐานข้อมูลไว้ เพราะ integration test ต่อฐานข้อมูลจริง
      - name: Test
        if: env.DB_URL != ''
        run: ./mvnw -B test

      - name: Upload test report
        if: env.DB_URL != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: code/battle-iq/target/surefire-reports

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set, skipping deploy"
            exit 0
          fi
          curl -sf -X POST "$HOOK"
          echo "Render deploy triggered"
