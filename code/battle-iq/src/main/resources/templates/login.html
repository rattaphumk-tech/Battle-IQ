<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('เข้าสู่ระบบ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <div class="card">
        <h2>เข้าสู่ระบบ</h2>
        <form id="login-form">
            <label for="username">ชื่อผู้ใช้</label>
            <input id="username" required>
            <label for="password">รหัสผ่าน</label>
            <input id="password" type="password" required>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <div id="message" class="message"></div>
        <p>ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a></p>
    </div>
</main>

<script>
    document.getElementById('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const body = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };
        try {
            const user = await api('/users/login', { method: 'POST', body: JSON.stringify(body) });
            setUser(user);
            location.href = '/categories';
        } catch (error) {
            showMessage('message', error.message, true);
        }
    });
</script>
</body>
</html>
