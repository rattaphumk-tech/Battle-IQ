<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('อันดับ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <div class="card">
        <h2>อันดับผู้เล่น</h2>
        <div id="message" class="message"></div>
        <table>
            <thead>
            <tr>
                <th>อันดับ</th>
                <th>ผู้เล่น</th>
                <th>เลเวล</th>
                <th>คะแนนรวม</th>
            </tr>
            </thead>
            <tbody id="leaderboard-rows"></tbody>
        </table>
        <div class="pager">
            <button class="secondary" id="prev-button" onclick="loadLeaderboard(currentPage - 1)">ก่อนหน้า</button>
            <span id="page-info"></span>
            <button class="secondary" id="next-button" onclick="loadLeaderboard(currentPage + 1)">ถัดไป</button>
        </div>
    </div>
</main>

<script>
    const PAGE_SIZE = 10;
    let currentPage = 0;

    async function loadLeaderboard(page) {
        try {
            const data = await api('/leaderboard?page=' + page + '&size=' + PAGE_SIZE);
            const pageInfo = data.page || data;
            currentPage = pageInfo.number;

            document.getElementById('leaderboard-rows').innerHTML = data.content.map(entry =>
                '<tr><td>' + entry.rank + '</td>'
                + '<td>' + escapeHtml(entry.fullName || entry.username) + '</td>'
                + '<td>' + entry.level + '</td>'
                + '<td>' + entry.totalScore + '</td></tr>'
            ).join('');

            document.getElementById('page-info').textContent =
                'หน้า ' + (pageInfo.number + 1) + ' / ' + Math.max(pageInfo.totalPages, 1);
            document.getElementById('prev-button').disabled = pageInfo.number <= 0;
            document.getElementById('next-button').disabled = pageInfo.number >= pageInfo.totalPages - 1;
        } catch (error) {
            showMessage('message', error.message, true);
        }
    }

    loadLeaderboard(0);
</script>
</body>
</html>
