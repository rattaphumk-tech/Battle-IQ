<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('จัดการหมวดหมู่')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <div class="card">
        <h2 id="form-title">เพิ่มหมวดหมู่</h2>
        <form id="category-form">
            <input type="hidden" id="category-id">
            <label for="name">ชื่อหมวดหมู่ (2-50 ตัวอักษร)</label>
            <input id="name" minlength="2" maxlength="50" required>
            <label for="description">คำอธิบาย</label>
            <input id="description" maxlength="255">
            <button type="submit">บันทึก</button>
            <button type="button" class="secondary" onclick="resetForm()">ล้างฟอร์ม</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <div class="card">
        <h2>หมวดหมู่ทั้งหมด</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>ชื่อ</th>
                <th>คำอธิบาย</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="category-rows"></tbody>
        </table>
    </div>
</main>

<script>
    let categories = {};

    async function loadCategories() {
        try {
            const list = await api('/categories');
            categories = {};
            list.forEach(category => categories[category.id] = category);
            document.getElementById('category-rows').innerHTML = list.map(category =>
                '<tr><td>' + category.id + '</td>'
                + '<td>' + escapeHtml(category.name) + '</td>'
                + '<td>' + escapeHtml(category.description) + '</td>'
                + '<td><button onclick="editCategory(' + category.id + ')">แก้ไข</button> '
                + '<button class="danger" onclick="deleteCategory(' + category.id + ')">ลบ</button></td></tr>'
            ).join('');
        } catch (error) {
            showMessage('message', error.message, true);
        }
    }

    function editCategory(id) {
        const category = categories[id];
        document.getElementById('category-id').value = id;
        document.getElementById('name').value = category.name;
        document.getElementById('description').value = category.description || '';
        document.getElementById('form-title').textContent = 'แก้ไขหมวดหมู่ #' + id;
    }

    function resetForm() {
        document.getElementById('category-form').reset();
        document.getElementById('category-id').value = '';
        document.getElementById('form-title').textContent = 'เพิ่มหมวดหมู่';
    }

    async function deleteCategory(id) {
        if (!confirm('ลบหมวดหมู่ #' + id + ' พร้อมคำถามในหมวดนี้ ใช่หรือไม่')) {
            return;
        }
        try {
            await api('/categories/' + id, { method: 'DELETE' });
            showMessage('message', 'ลบหมวดหมู่แล้ว', false);
            loadCategories();
        } catch (error) {
            showMessage('message', error.message, true);
        }
    }

    document.getElementById('category-form').addEventListener('submit', async event => {
        event.preventDefault();
        const id = document.getElementById('category-id').value;
        const body = {
            name: document.getElementById('name').value.trim(),
            description: document.getElementById('description').value.trim()
        };
        try {
            if (id) {
                await api('/categories/' + id, { method: 'PUT', body: JSON.stringify(body) });
            } else {
                await api('/categories', { method: 'POST', body: JSON.stringify(body) });
            }
            showMessage('message', 'บันทึกหมวดหมู่แล้ว', false);
            resetForm();
            loadCategories();
        } catch (error) {
            showMessage('message', error.message, true);
        }
    });

    loadCategories();
</script>
</body>
</html>
